<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Lab 12.5: chassis and instance layers">
  <rect width="900" height="420" fill="#0f172a"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#e2e8f0}
    .t{font-size:18px;font-weight:700}
    .s{font-size:13px;fill:#94a3b8}
    .b{fill:#1e293b;stroke:#38bdf8;stroke-width:2}
    .c{fill:#1e293b;stroke:#a78bfa;stroke-width:2}
    .l{stroke:#64748b;stroke-width:2;fill:none}
    .d{stroke:#a78bfa;stroke-width:2;fill:none;stroke-dasharray:6 5}
  </style>
  <text x="30" y="40" class="t">Lab 12.5: chassis and instance layers</text>
  <rect class="b" x="30" y="170" width="210" height="90" rx="10"/>
  <text x="135" y="213" class="t" text-anchor="middle">Management interface</text>
  <text x="135" y="237" class="s" text-anchor="middle">static IP, no DHCP</text>
  <path class="l" d="M240 215 H345"/>
  <rect class="b" x="345" y="170" width="210" height="90" rx="10"/>
  <text x="450" y="213" class="t" text-anchor="middle">Lab FTD</text>
  <text x="450" y="237" class="s" text-anchor="middle">chassis plus instances</text>
  <rect class="b" x="345" y="320" width="210" height="70" rx="10"/>
  <text x="450" y="353" class="t" text-anchor="middle">Lab FMC 7.6</text>
  <text x="450" y="377" class="s" text-anchor="middle">Chassis Platform Settings</text>
  <rect class="b" x="660" y="60" width="210" height="90" rx="10"/>
  <text x="765" y="103" class="t" text-anchor="middle">Chassis layer</text>
  <text x="765" y="127" class="s" text-anchor="middle">DNS, SSH, syslog, time</text>
  <rect class="c" x="660" y="320" width="210" height="70" rx="10"/>
  <text x="765" y="353" class="t" text-anchor="middle">Instance layer</text>
  <text x="765" y="377" class="s" text-anchor="middle">own management IP</text>
  <path class="l" d="M555 215 H607 V105 H660"/>
  <path class="l" d="M450 260 V320"/>
  <path class="d" d="M555 355 H660"/>
  <text x="458" y="296" class="s">manages</text>
  <text x="30" y="408" class="s">Solid: traffic. Dashed: management of the chassis and each instance.</text>
</svg>
