<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Lab 16.7: choosing a manager">
  <rect width="900" height="420" fill="#0f172a"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#e2e8f0}
    .t{font-size:18px;font-weight:700}
    .s{font-size:13px;fill:#94a3b8}
    .b{fill:#1e293b;stroke:#38bdf8;stroke-width:2}
    .c{fill:#1e293b;stroke:#a78bfa;stroke-width:2}
    .l{stroke:#64748b;stroke-width:2;fill:none}
    .d{stroke:#a78bfa;stroke-width:2;fill:none;stroke-dasharray:6 5}
  </style>
  <text x="30" y="40" class="t">Lab 16.7: choosing a manager</text>
  <rect class="b" x="30" y="100" width="210" height="90" rx="10"/>
  <text x="135" y="143" class="t" text-anchor="middle">FDM device</text>
  <text x="135" y="167" class="s" text-anchor="middle">local management</text>
  <path class="l" d="M240 145 H292 V215 H345"/>
  <rect class="b" x="30" y="250" width="210" height="90" rx="10"/>
  <text x="135" y="293" class="t" text-anchor="middle">FMC device</text>
  <text x="135" y="317" class="s" text-anchor="middle">registered to FMC</text>
  <path class="l" d="M240 295 H292 V215 H345"/>
  <rect class="b" x="345" y="170" width="210" height="90" rx="10"/>
  <text x="450" y="213" class="t" text-anchor="middle">Lab FTD</text>
  <text x="450" y="237" class="s" text-anchor="middle">same software, two managers</text>
  <rect class="b" x="345" y="320" width="210" height="70" rx="10"/>
  <text x="450" y="353" class="t" text-anchor="middle">Lab FMC 7.6</text>
  <text x="450" y="377" class="s" text-anchor="middle">on-premises manager</text>
